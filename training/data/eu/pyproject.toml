[project]
name = "eu-corpus-discovery"
version = "0.1.0"
description = "Bounded discovery of EU institutional documents and native text"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<0.29",
    "beautifulsoup4>=4.13,<5",
    "lxml>=5.3,<7",
    "pyarrow>=19,<24",
    "pypdf>=5,<7",
    "huggingface-hub>=0.34,<2",
    "modal[api-proxy-support]>=1.0,<2",
    "tiktoken>=0.12,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.17.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
