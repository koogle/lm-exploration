[project]
name = "lm-exploration-training"
version = "0.1.0"
description = "Readable from-scratch language model training experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.11",
    "torch>=2.5,<3",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
corpus = [
    "tokenizers==0.22.2",
    "requests==2.34.2",
    "pyarrow==26.0.0",
    "huggingface-hub==1.33.0",
]
hybrid = [
    "fla-core==0.6.0",
]
research = [
    "safetensors>=0.4,<1",
    "matplotlib==3.11.2",
    "modal[api-proxy-support]==1.6.2",
    "truststore==0.10.5",
]

[project.scripts]
lm-prepare-simple-llm = "training_data.prepare_simple_llm:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["model_10m", "model_100m", "model_hybrid", "training_data", "training_data.fetching", "trainer", "tokenizer", "modal_scripts", "distributed", "workflows", "sampling"]

[tool.setuptools.package-dir]
model_10m = "10m"
model_100m = "100m"
model_hybrid = "hybrid"
training_data = "data"
sampling = "analysis/sampling"

[tool.setuptools.package-data]
trainer = ["kernels/*.cu"]
model_hybrid = ["kernels/*.cu"]
workflows = ["*.json", "model_configs/*.json", "model_configs/historical/*.json", "datasets/*.json"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Manifest/config validation raises ValueError on purpose; callers catch ValueError.
ignore = ["TRY004"]

[tool.ruff.lint.per-file-ignores]
# The folder name is the model size; setuptools installs it as `model_100m`.
"100m/__init__.py" = ["N999"]
"hybrid/__init__.py" = ["N999"]
"10m/__init__.py" = ["N999"]
