<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d19" />
    <title>Web Inference — Shader demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="canvas" aria-label="Mandelbrot fractal rendered by a Rust-controlled WebGPU shader"></canvas>
    <fieldset id="controls" disabled>
      <legend>Mandelbrot</legend>
      <div class="parameters">
        <label for="zoom-level">Zoom <output id="zoom-value" for="zoom-level">1×</output></label>
        <input id="zoom-level" type="range" min="-4" max="16" step="0.001" value="0" />
        <label for="iterations">Iteration detail <output id="iterations-value" for="iterations">384</output></label>
        <input id="iterations" type="range" min="64" max="1024" step="32" value="384" />
        <label for="color-density">Color bands <output id="density-value" for="color-density">0.025</output></label>
        <input id="color-density" type="range" min="0.005" max="0.08" step="0.001" value="0.025" />
        <label for="color-speed">Color speed <output id="speed-value" for="color-speed">0.035/s</output></label>
        <input id="color-speed" type="range" min="0" max="0.15" step="0.005" value="0.035" />
      </div>
      <div class="buttons" role="group" aria-label="Fractal controls">
        <button data-action="left" aria-label="Pan left">←</button>
        <button data-action="up" aria-label="Pan up">↑</button>
        <button data-action="down" aria-label="Pan down">↓</button>
        <button data-action="right" aria-label="Pan right">→</button>
        <button data-action="in" aria-label="Zoom in">+</button>
        <button data-action="out" aria-label="Zoom out">−</button>
        <button data-action="detail">Explore detail</button>
        <button data-action="pause" aria-pressed="false">Pause colors</button>
        <button data-action="reset">Reset</button>
      </div>
    </fieldset>
    <p id="error" role="alert" hidden></p>
    <noscript>This demo requires JavaScript and WebGPU.</noscript>
    <script type="module" src="./src.js"></script>
  </body>
</html>
