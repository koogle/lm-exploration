[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-detection"
version = "0.1.0"
description = "Post-training a small vision-language model for one-pass object detection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "pillow>=10,<13",
    "pyarrow>=17",
    "huggingface-hub>=0.30,<2",
]

[project.optional-dependencies]
# Moondream 2 runs through its Hub code; pyvips does its image tiling.
model = [
    "torch==2.6.0",
    "transformers==4.52.4",
    "accelerate==1.7.0",
    "einops==0.8.1",
    "pyvips-binary==8.16.0",
    "pyvips==2.2.3",
]
modal = ["modal[api-proxy-support]==1.6.1"]
dev = ["pytest>=8,<9", "ruff>=0.11"]
figures = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
